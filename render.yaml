services:
  - type: web
    name: collation-app
    env: python
    buildCommand: |
      # Build frontend
      cd frontend
      npm install
      npm run build
      cd ..
      # Build backend
      cd backend
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      # Copy frontend build to Django static directory
      mkdir -p static
      cp -r ../frontend/build/* static/
      python manage.py collectstatic --noinput
    startCommand: |
      cd backend
      export PATH="/opt/render/project/poetry/bin:$PATH"
      python manage.py migrate
      gunicorn collation_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: REACT_APP_API_BASE_URL
        value: "/api" 
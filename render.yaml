services:
  - type: web
    name: collation-app
    env: python
    buildCommand: |
      # Build frontend
      cd frontend
      npm install
      npm run build
      cd ..
      # Build backend
      cd backend
      chmod +x start.sh
      # Copy frontend build to Django static directory
      mkdir -p static
      cp -r ../frontend/build/* static/
    startCommand: |
      cd backend
      ./start.sh
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: REACT_APP_API_BASE_URL
        value: "/api" 
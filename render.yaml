services:
  - type: web
    name: collation-app
    env: python
    buildCommand: |
      # Create src directory and copy files
      mkdir -p /opt/render/project/src
      cp -r backend /opt/render/project/src/
      cp -r frontend /opt/render/project/src/
      # Build frontend
      cd /opt/render/project/src/frontend
      npm install
      npm run build
      # Setup backend
      cd /opt/render/project/src/backend
      python -m venv .venv
      . .venv/bin/activate
      pip install -r requirements.txt
      python patch_collatex.py
      # Create static directories
      mkdir -p staticfiles
      mkdir -p media
      # Copy frontend build to static directory
      cp -r /opt/render/project/src/frontend/build/* staticfiles/
      python manage.py collectstatic --noinput
    startCommand: |
      cd /opt/render/project/src/backend
      . .venv/bin/activate
      python manage.py migrate
      gunicorn collation_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: REACT_APP_API_BASE_URL
        value: "/api"
      - key: STATIC_ROOT
        value: "staticfiles"
      - key: MEDIA_ROOT
        value: "media" 
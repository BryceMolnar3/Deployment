services:
  - type: web
    name: collation-app
    env: python
    buildCommand: |
      # Create src directory and move manage.py
      mkdir -p /opt/render/project/src
      cp backend/manage.py /opt/render/project/src/
      cp -r backend/collation /opt/render/project/src/
      cp -r backend/collation_backend /opt/render/project/src/
      # Build frontend
      cd frontend
      npm install
      npm run build
      cd ..
      # Setup backend
      cd /opt/render/project/src
      # Copy frontend build to Django static directory
      mkdir -p static
      cp -r ../frontend/build/* static/
    startCommand: |
      cd /opt/render/project/src
      poetry install --no-dev
      poetry run python manage.py migrate
      poetry run python manage.py collectstatic --noinput
      poetry run gunicorn collation_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: REACT_APP_API_BASE_URL
        value: "/api" 
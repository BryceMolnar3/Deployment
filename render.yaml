services:
  - type: web
    name: collation-app
    env: python
    buildCommand: |
      cd frontend && npm install && npm run build && cd .. && cd backend/collation_backend && pip install -r ../requirements.txt && mkdir -p static && cp -r ../../frontend/build/* static/ && python manage.py collectstatic --noinput
    startCommand: |
      cd backend/collation_backend
      python manage.py migrate
      gunicorn collation_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: REACT_APP_API_BASE_URL
        value: "/api"
      - key: STATIC_ROOT
        value: "static"
      - key: MEDIA_ROOT
        value: "../media" 
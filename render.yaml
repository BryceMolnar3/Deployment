services:
  - type: web
    name: collation-app
    env: python
    buildCommand: |
      # Build frontend
      cd frontend
      echo "Current directory: $(pwd)"
      echo "Listing frontend directory:"
      ls -la
      echo "Listing src directory:"
      ls -la src
      echo "Listing services directory:"
      ls -la src/services
      npm install
      npm run build
      cd ..
      # Build backend
      cd backend
      pip install -r requirements.txt
      # Copy frontend build to Django static directory
      mkdir -p static
      cp -r ../frontend/build/* static/
      python manage.py collectstatic --noinput
    startCommand: |
      cd backend
      gunicorn collation_backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: REACT_APP_API_BASE_URL
        value: "/api" 